name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        working-directory: src
        run: dotnet restore MailDog.slnx

      - name: Build
        working-directory: src
        run: dotnet build MailDog.slnx -c Release --no-restore

      - name: Test
        working-directory: src
        run: dotnet test MailDog.slnx -c Release --no-build

      - name: Verify dependency direction
        shell: pwsh
        run: ./src/build/verify-dependencies.ps1

      - name: CLI smoke
        shell: pwsh
        run: |
          # GitHub 的 pwsh 默认把非零退出码当异常，这里要读退出码，所以关掉。
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = 'src/MailDog.Cli/bin/Release/net11.0/MailDog.Cli.exe'
          if (-not (Test-Path $exe)) { throw "找不到 CLI 可执行文件：$exe" }
          Write-Host "CLI: $exe"

          $schema = & $exe schema | ConvertFrom-Json
          foreach ($name in @('tool', 'commands', 'exitCodes')) {
            if ($null -eq $schema.$name) { throw "schema 缺少 $name（原始输出可能不是合法 JSON）" }
          }
          Write-Host "schema ok: $($schema.commands.Count) 个命令"
          if ($schema.tool -ne 'maildog') { throw "schema.tool 应为 maildog，实际 $($schema.tool)" }
          if ($schema.commands.name -notcontains 'send') { throw 'schema 里缺少 send' }
          if ($schema.commands.name -notcontains 'move') { throw 'schema 里缺少 move' }
          if ($schema.exitCodes.'5' -notmatch '参数') { throw 'schema 退出码说明不对' }

          & $exe help | Out-Null
          Write-Host "help exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "help 应退出 0，实际 $LASTEXITCODE" }

          & $exe list --nope 2>$null
          Write-Host "bad flag exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 5) { throw "未知开关应退出 5，实际 $LASTEXITCODE" }

          # 注：不在这里断言“连不上 Engine 退出 3”——CI 机上没有 Engine 是 3，
          # 但开发机上 Engine 常驻时同一条命令会变成“没找到账号”的 2，不适合做稳定断言。
          Write-Host "CLI smoke passed"
          exit 0

      - name: CLI seed integration
        shell: pwsh
        run: ./src/build/ci-cli-seed.ps1

      - name: CLI HTML-only integration
        shell: pwsh
        run: ./src/build/ci-cli-html.ps1

      - name: Verify Native AOT
        shell: pwsh
        run: ./src/build/verify-aot.ps1 -Runtime win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MailDog-win-x64
          path: |
            dist/win-x64/MailDog/
            dist/win-x64/MailDog-win-x64.zip
          if-no-files-found: error
