name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0），留空则读取 src/Directory.Build.props'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $inputVersion = '${{ inputs.version }}'
          $refName = '${{ github.ref_name }}'
          if ($inputVersion) {
            $version = $inputVersion
          }
          elseif ($refName -match '^v(?<ver>.+)$') {
            $version = $Matches.ver
          }
          else {
            $props = Get-Content src/Directory.Build.props -Raw
            $version = [regex]::Match($props, '<Version>([^<]+)</Version>').Groups[1].Value
          }
          if (-not $version) { throw '无法确定版本号。' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish and package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./src/build/package.ps1 -Version '${{ steps.version.outputs.version }}' -Runtime ${{ matrix.runtime }}

      - name: Publish and package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: ./src/build/package-linux.sh ${{ matrix.runtime }} '${{ steps.version.outputs.version }}'

      - name: Install Inno Setup
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./src/build/package.ps1 -Version '${{ steps.version.outputs.version }}' -Runtime win-x64 -Installer -SkipPublish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MailDog-${{ matrix.runtime }}
          path: dist/MailDog-${{ steps.version.outputs.version }}-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName
          if (-not $files) { throw '没有可发布的产物。' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          }
          else {
            gh release create $tag --title "MailDog $tag" --generate-notes @files
          }
